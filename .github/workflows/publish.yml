name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      strata_ref:
        description: "Strata git ref (commit/tag/branch) to build"
        required: false
        default: "99f3dbd0b21d1401b3769e0c0d963913607f380b"
      cuda_architectures:
        description: "CUDA archs, semicolon-separated (e.g. 120, or 86;89;120)"
        required: false
        default: "120"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase, GHCR requires it)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures || '120' }}
            STRATA_REF=${{ github.event.inputs.strata_ref || '99f3dbd0b21d1401b3769e0c0d963913607f380b' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
