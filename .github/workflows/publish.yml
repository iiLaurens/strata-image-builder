name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # weekly: rebuild against upstream's latest, so the image stays current
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      strata_ref:
        description: "Strata ref (branch/tag/commit). Default: latest main."
        required: false
        default: "main"
      cuda_architectures:
        description: "CUDA archs, semicolon-separated (e.g. 120, or 86;89;120)"
        required: false
        default: "120"
      cuda_version:
        description: "CUDA base tag"
        required: false
        default: "13.0.0"
      force:
        description: "Build even if this Strata commit is already published"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase, GHCR requires it)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve Strata ref and version
        id: strata
        env:
          REF: ${{ github.event.inputs.strata_ref || 'main' }}
        run: |
          set -euo pipefail
          repo=https://github.com/Niko1221/Strata.git
          sha=$(git ls-remote "$repo" "refs/heads/$REF" | awk '{print $1}')
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/tags/$REF^{}" | awk '{print $1}')
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/tags/$REF" | awk '{print $1}')
          [ -n "$sha" ] || sha="$REF"
          ver=$(curl -fsSL "https://raw.githubusercontent.com/Niko1221/Strata/$sha/CMakeLists.txt" \
                 | grep -oE 'project\(strata VERSION [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $3}')
          [ -n "$ver" ] || ver="0.0.0"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "resolved $REF -> $sha (Strata $ver)"

      # scheduled/manual runs skip when the published image already sits on this
      # exact upstream commit. Push/tag runs always build.
      - name: Check whether this commit is already published
        id: check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          cur=$(skopeo inspect --no-tags --authfile "${HOME}/.docker/config.json" \
                  "docker://${{ steps.img.outputs.name }}:latest" 2>/dev/null \
                | jq -r '.Labels["org.opencontainers.image.revision"] // empty' || true)
          want="${{ steps.strata.outputs.sha }}"
          echo "published revision: ${cur:-<none>} | upstream: $want"
          if [ -n "$cur" ] && [ "$cur" = "$want" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already up to date - nothing to build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.strata.outputs.version }}
            type=raw,value=${{ steps.strata.outputs.version }}-cu${{ github.event.inputs.cuda_version || '13.0.0' }}
            type=sha,format=short

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures || '120' }}
            CUDA_VERSION=${{ github.event.inputs.cuda_version || '13.0.0' }}
            STRATA_REF=${{ steps.strata.outputs.sha }}
            STRATA_VERSION=${{ steps.strata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
