name: publish

on:
  push:
    branches: [main]
    paths: ["Dockerfile"]        # rebuild only when the image recipe changes
  schedule:
    - cron: "0 4 * * 1"          # weekly: pick up a new upstream tag
  workflow_dispatch:
    inputs:
      strata_ref:
        description: "Upstream tag/ref. Empty = latest tagged release."
        required: false
        default: ""
      cuda_architectures:
        description: "CUDA archs, semicolon-separated (e.g. 120, or 86;89;120)"
        required: false
        default: "120"
      cuda_version:
        description: "CUDA base tag"
        required: false
        default: "13.0.0"
      force:
        description: "Build even if this release is already published"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase, GHCR requires it)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream release
        id: strata
        env:
          REF: ${{ github.event.inputs.strata_ref || '' }}
        run: |
          set -euo pipefail
          repo=https://github.com/Niko1221/Strata.git
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs "$repo" \
                    | awk -F/ '{print $NF}' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$REF" ] || { echo "::error::no upstream tag found"; exit 1; }
          sha=$(git ls-remote "$repo" "refs/tags/$REF^{}" | awk '{print $1}')
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/tags/$REF" | awk '{print $1}')
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/heads/$REF" | awk '{print $1}')
          [ -n "$sha" ] || sha="$REF"
          ver=$(curl -fsSL "https://raw.githubusercontent.com/Niko1221/Strata/$sha/CMakeLists.txt" \
                 | grep -oE 'project\(strata VERSION [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $3}')
          [ -n "$ver" ] || ver="${REF#v}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "resolved $REF -> $sha (Strata $ver)"

      # scheduled/manual runs skip when the published image is already on this
      # exact release commit; push (Dockerfile changed) always builds.
      - name: Check whether this release is already published
        id: check
        if: github.event_name != 'push'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          cur=$(skopeo inspect --no-tags --authfile "${HOME}/.docker/config.json" \
                  "docker://${{ steps.img.outputs.name }}:latest" 2>/dev/null \
                | jq -r '.Labels["org.opencontainers.image.revision"] // empty' || true)
          want="${{ steps.strata.outputs.sha }}"
          echo "published revision: ${cur:-<none>} | upstream: $want"
          if [ -n "$cur" ] && [ "$cur" = "$want" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already up to date - nothing to build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.strata.outputs.version }}
            type=raw,value=${{ steps.strata.outputs.version }}-cu${{ github.event.inputs.cuda_version || '13.0.0' }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures || '120' }}
            CUDA_VERSION=${{ github.event.inputs.cuda_version || '13.0.0' }}
            STRATA_REF=${{ steps.strata.outputs.sha }}
            STRATA_VERSION=${{ steps.strata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
